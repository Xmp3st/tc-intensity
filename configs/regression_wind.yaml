# 预设：北太平洋台风强度「回归」任务（预测最大持续风速 m/s）
# 用法: python train.py --config configs/regression_wind.yaml
# 说明：直接回归连续风速，可输出比离散分级更细的强度估计。
experiment:
  name: "tc_reg_wind"
  seed: 42
  output_dir: "outputs"
  num_workers: 4

data:
  mode: "csv"
  task: "regression"
  root_dir: "data"
  label_file: "data/labels.csv"
  regression_target: "wind_speed_ms"
  split: [0.7, 0.15, 0.15]
  image_size: 224
  class_names: ["TD", "TS", "STS", "TY", "STY", "SuperTY"]  # 仅作参考/分区
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  train:
    random_resized_crop: true
    horizontal_flip: true
    rotate: 15
    color_jitter: [0.2, 0.2, 0.2, 0.0]
    normalize: true
  val:
    resize: 256
    center_crop: 224
    normalize: true

model:
  backbone: "resnet18"
  pretrained: true
  freeze_backbone: false
  dropout: 0.3
  reg_hidden: 128

train:
  epochs: 60
  batch_size: 32
  optimizer: "adamw"
  lr: 3.0e-4
  weight_decay: 1.0e-2
  scheduler: "cosine"
  loss: "huber"
  mixed_precision: true
  grad_clip: 0.0
  early_stopping_patience: 12
  save_top_k: 3
  log_every: 20

device:
  mode: "auto"
