# =============================================================================
# TCIR 北太平洋（WPAC 西北太平洋）强度回归 —— 正式训练配置
# -----------------------------------------------------------------------------
# 数据：原始 TCIR-ATLN_EPAC_WPAC.h5(30GB) 已抽取为紧凑本地文件
#        data/wpac_96.h5      (20059,96,96,3)  IR1/WV/PMW 三通道、已下采样、NaN置0
#        data/wpac_compact.csv  配套标签(Vmax)/风暴ID(ID)/区域，matrix_index 与 h5 行对齐
#       均由 scripts/extract_wpac.py 一次性生成（顺带算出下方归一化统计）。
#       ⚠️ 注意：data/wpac_compact.csv 的 matrix_index 列为「紧凑 h5 行号(0-based 顺序)」，
#          与原始 30GB h5 的帧号不同；predict.py --indices 与误差分析里的 matrix_index 均指该紧凑行号。
# 任务：卫星图(IR1/WV/PMW 三通道, 96x96) -> 最大持续风速 Vmax(knots) 回归
# 无需人工标注：TCIR best-track 已自带强度标签
#
# 运行：
#   python train.py -c configs/tcir_wpac_train.yaml
#   python train.py -c configs/tcir_wpac_train.yaml --set train.epochs=60
# 对比频带缺失修正策略（每次结果记入 logs/training_runs.csv，便于横向对比）：
#   python train.py -c configs/tcir_wpac_train.yaml --set data.tcir.missing_band=mean
#   python train.py -c configs/tcir_wpac_train.yaml --set data.tcir.missing_band=drop
#   python train.py -c configs/tcir_wpac_train.yaml --set data.tcir.missing_band=interp
#       （interp=局部区域缺失的空间插值修复；见下方 missing_region_* 参数）
# =============================================================================

experiment:
  name: "tcir_wpac_v1"
  seed: 42
  output_dir: "outputs/tcir_wpac"
  num_workers: 4

# -----------------------------------------------------------------------------
# 数据：dataset=tcir 走专用分支；label_source=csv 用 wpac_info.csv 驱动
#   csv 提供：matrix_index(取图) / Vmax(标签) / ID(按风暴防泄漏切分)
# -----------------------------------------------------------------------------
data:
  dataset: "tcir"
  task: "regression"
  root_dir: "."
  split: [0.7, 0.15, 0.15]
  mean: [0.485, 0.456, 0.406]     # 占位（多通道不用 ImageNet 归一化）
  std:  [0.229, 0.224, 0.225]
  tcir:
    h5_path: "data/wpac_96.h5"          # 相对项目根；跨机器只需保证 data/ 下有该文件
    csv_path: "data/wpac_compact.csv"   # 配套标签（Vmax/ID/data_set），行序与 h5 对齐
    label_source: "csv"           # 用 CSV 驱动（推荐，绕开 pandas-fixed 解析）
    channels: ["IR1", "WV", "PMW"]   # 弃用白天不稳定的 VIS
    target: "intensity"           # h5-info 模式用（csv 模式用 target_col）
    target_col: "Vmax"            # 主目标：最大持续风速(knots)
    label_unit: "knots"
    index_col: "matrix_index"     # CSV 中指向 h5 帧序号的列
    storm_col: "ID"               # 按风暴 ID 做防泄漏切分
    region_col: "data_set"        # 区域列（CSV 已全部是 WPAC）
    regions: null                 # 全用 CSV（已限 WPAC）；也可设 ["WPAC","EPAC"] 扩到北太平洋
    nan_mode: "zero"              # NaN 已在抽取阶段置 0
    normalize: true               # 用逐通道 mean/std（由 extract_wpac 统计得到）
    norm_mean: [260.864, 232.83, 0.638]
    norm_std:  [32.849, 15.389, 1.71]
    resize: 96                    # 201->96，平衡细节与算力
    split_strategy: "by_storm"
    # 划分种子：固定后「多次训练取最优」(train_3x) 各 run 共用同一 train/val/test 划分，
    # val 指标才可比、择优才无偏；不设则该值回退到 experiment.seed（每次换种子=换划分）
    split_seed: 42
    # ---- 频带(通道)缺失修正 ----
    # 两类问题：
    #  (A) 整通道缺失：WPAC 中 IR1/WV 各 16 帧、PMW 8 帧整通道全0（卫星未观测）。
    #      策略 none(保持0=基线) | zero(显式置0) | mean(填通道均值,归一化后中性) | drop(剔除含缺失样本)
    #  (B) 局部区域缺失：某通道图像内「某些空间区域」缺数据（如 PMW 条带缺口、IR1/WV 涂抹带），
    #      用空间插值(inpainting)就地填补，而非整通道丢弃 —— 选 missing_band=interp 启用。
    missing_band: "none"         # none | zero | mean | drop | interp(局部区域插值)
                                 # 注：训练时用 --set 开启的修正，会在 train 结束时写入
                                 # outputs/<dir>/<name>/config_used.yaml；eval/visualize/errors
                                 # 会自动把缺失修正等预处理键对齐到该训练配置（除非你显式 --set 覆盖）。
    missing_detect: "constant"   # 整通道缺失判定: constant | var
    missing_mask_path: "logs/band_missing_mask.npz"  # drop 策略复用的整通道掩码缓存(由 scan_bands 生成)

    # ---- 局部区域缺失插值参数（仅当 missing_band=interp 时生效）----
    # 缺测判定：精确等于 sentinel(0) 的像素，或低于物理下界 low_thr 的像素（覆盖 bilinear 下采样的涂抹过渡带）。
    # low_thr 按通道顺序对齐 [IR1, WV, PMW]；PMW 的 0 是合法值，设为 -999 表示「该通道不启用低界/不参与」。
    missing_region_channels: ["IR1", "WV"]   # 默认只对 IR1/WV 做区域插值（亮温单位，0/异常低值必为缺测）
    missing_region_sentinel: 0.0             # 缺测哨兵值（TCIR 经 nan_to_num 后为 0）
    missing_region_low_thr: [150.0, 150.0, -999.0]  # IR1/WV 亮温不可能 <150K，可安全覆盖涂抹带；PMW=-999 禁用
    missing_region_min_blob: 20              # 缺测连通块最小像素数(96x96)，小于此视为噪声/合法，忽略
    missing_region_dilate: 1                 # 对缺测掩码膨胀次数，进一步覆盖过渡带
    missing_region_method: "griddata"        # griddata(scipy 线性+最近邻/均值兜底) | telea/ns(需 cv2,否则回退)
    missing_region_max_frac: 1.0             # 缺测占比超过此值则退化为通道均值填充(避免大缺口无意义外推)；1.0=不触发

    # ---- 过度损坏样本剔除（缺测面积过大时插值也不可靠 -> 直接剔除，而非硬修）----
    # 判据三者取 OR，任一满足即剔除该样本：
    #   * 「坏道」数 >= damage_filter_bad_channels
    #   * 全图缺测面积占比   >= damage_filter_image_frac
    #   * 单通道缺测面积占比 >= damage_filter_channel_frac
    damage_filter: true                    # 开启过滤（训练侧 + 测试侧统一标准）
    damage_filter_splits: ["train", "val", "test"]   # 作用于哪些子集：test / val / train（可多选）
    damage_filter_bad_definition: "any"    # 坏道口径: any(有缺测的通道数) | whole(整通道缺失的通道数)
    damage_filter_bad_channels: 2          # 坏道数 >= 2 -> 剔除
    damage_filter_image_frac: 0.5          # 全图缺测面积占比 >= 1/2 -> 剔除
    damage_filter_channel_frac: 0.6667     # 单通道缺测面积占比 >= 2/3 -> 剔除

# -----------------------------------------------------------------------------
# 增强：台风无 canonical 朝向，旋转/翻转安全且有助于泛化
# -----------------------------------------------------------------------------
augmentation:
  train:
    random_resized_crop: false
    horizontal_flip: true
    rotate: 15
    color_jitter: [0.0, 0.0, 0.0, 0.0]
    normalize: false
  val:
    resize: 256
    center_crop: 96
    normalize: false

# -----------------------------------------------------------------------------
# 模型：vgg16 骨干，in_channels=3 适配三通道卫星图，回归头
# -----------------------------------------------------------------------------
model:
  backbone: "vgg16"
  pretrained: true
  freeze_backbone: false
  dropout: 0.3
  reg_hidden: 64
  in_channels: 3                  # 与 tcir.channels 长度一致

# -----------------------------------------------------------------------------
# 训练：回归默认 MSE；knot 量级较大，可用 huber 更稳
# -----------------------------------------------------------------------------
train:
  epochs: 80
  batch_size: 64
  optimizer: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-2
  scheduler: "cosine"
  lr_step_size: 10
  lr_gamma: 0.1
  label_smoothing: 0.0
  loss: "mse"                     # mse | huber
  mixed_precision: true           # RTX 5060 (cu128) 加速
  grad_clip: 0.0
  early_stopping_patience: 20     # 监控 val RMSE，20 轮不降则停（提高耐心，配合更多轮数）
  # ---- 检查点写入策略（长时训练经 9P 挂载写海量 195MB 大文件会压挂 9P 服务器）----
  save_top_k: 0                   # 0=不逐轮存 epoch_N.ckpt / top-k（仅保留 best + last），大幅降低写入
  save_last: true                 # 是否保存 last.ckpt
  save_last_every: 5              # 每 N 轮存一次 last.ckpt（1=每轮，5=降低写入频率）
  log_every: 50

device:
  mode: "cuda"
